name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate docs
        run: go generate ./...

      - name: Tidy modules
        run: go mod tidy

      - name: Check for uncommitted generated files
        run: git diff --exit-code

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./cmd/swarminator
